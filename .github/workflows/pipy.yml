name: Publish to PyPI

# Trusted publishing (PyPI pending publisher): the file name of this workflow
# must match the one registered on PyPI exactly — do not rename this file.
# Triggers when a GitHub Release is published; the release tag (vX.Y.Z) must
# match agent2perfetto.__version__.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC token for trusted publishing; no API token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
